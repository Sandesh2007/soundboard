[package]
name = "soundboard"
description = "A awesome soundboard app for streamers"
version = "0.1.0"
license = "GPL-3.0"
edition = "2021"
readme = "README.md"
repository = "https://github.com/sandesh2007/soundboard"

[dependencies]
gpui-kit = "0.6"
anyhow = "1.0"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
gpui-kit-assets = "0.6.6"
handy-keys = "0.3.4"
rust-embed = "8.12.0"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"


[package.metadata.deb]
maintainer = "sandesh2007 <sandeshsharma924@gmail.com>"
copyright = "2026, Sandesh"
# depends = "libc6, libasound2"
section = "sound"
priority = "optional"
assets = [
    ["target/release/soundboard", "usr/bin/soundboard", "755"],
]
